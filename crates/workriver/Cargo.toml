[package]
name = "workriver"
description = "Keep track of many coding agents working in parallel: the daemon, the CLI and the runtime adapter."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
workriver-core.workspace = true
workriver-data.workspace = true
workriver-scan.workspace = true
serde.workspace = true
serde_json.workspace = true
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive", "env"] }
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "net", "sync", "signal", "time"] }
axum = "0.8.9"
tokio-stream = { version = "0.1.19", features = ["sync"] }
rust-embed = { version = "8.14.0", features = ["mime-guess"] }
mime_guess = "2.0.5"
sha2 = "0.11.1"
# The object id git would give uncommitted work, which it has not hashed (views/code.rs).
sha1 = "0.11.0"
notify-debouncer-mini = "0.7.0"
ureq = { version = "3.5.2", default-features = false, features = ["json"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json"] }
humantime = "2"
# The note's diff in `intent history --diff` (workriver-scan has it already).
similar = { version = "3.2.1", default-features = false, features = ["std", "text"] }
tempfile = "3"

[dev-dependencies]
# `setsid` for a child with no terminal (tests/caller.rs); already in the lock file.
libc = "0.2"

# The chain of a caller's process (caller.rs): what `ps` reads, per system.
[target.'cfg(target_os = "macos")'.dependencies]
libproc = "0.15.0"

[target.'cfg(target_os = "linux")'.dependencies]
procfs = { version = "0.18.0", default-features = false }
