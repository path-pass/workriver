[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.100"
license = "MIT"

[workspace.dependencies]
workriver-core = { path = "crates/workriver-core" }
workriver-data = { path = "crates/workriver-data" }
workriver-scan = { path = "crates/workriver-scan" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
