# The second half of the one-off migration to virtual workspaces: writes the new store from
# what `old apply` made, with the product's own code (this branch's workriver-core and
# workriver-data), and checks it against the old state (see ../README.md). Not a member of
# the repository's workspace: never built, tested or shipped with the product.
[package]
name = "migrate-virtual-workspaces-new"
version = "0.0.0"
edition = "2024"
publish = false

[[bin]]
name = "new"
path = "src/main.rs"

[dependencies]
workriver-core = { path = "../../../crates/workriver-core" }
workriver-data = { path = "../../../crates/workriver-data" }
serde_json = "1.0.154"
rusqlite = { version = "0.43.0", features = ["bundled"] }
tempfile = "3"

# A workspace of its own: without it Cargo takes this package for a part of the root's.
[workspace]
