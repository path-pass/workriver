<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <script>
      // Remember visibility changes while the app script downloads.
      (() => {
        let hidden = document.hidden
        const rememberHidden = () => { hidden ||= document.hidden }
        if (!hidden) document.addEventListener('visibilitychange', rememberHidden)
        window.takeInitialPageHidden = () => {
          document.removeEventListener('visibilitychange', rememberHidden)
          return hidden
        }
      })()
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
